name: demo

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  bert-huggingface-wandb-demo:
    runs-on: ubuntu-latest

    env:
      WANDB_PROJECT: TA duty demo project
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: DuckyDuck123/hindi-en-demo-model
      UPLOAD_TO_HF: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bert-huggingface-wandb-demo .

      - name: Run inference inside Docker
        run: |
          docker run --rm \
            -e WANDB_API_KEY="${WANDB_API_KEY}" \
            -e WANDB_PROJECT="${WANDB_PROJECT}" \
            -e HF_TOKEN="${HF_TOKEN}" \
            -e HF_REPO_ID="${HF_REPO_ID}" \
            -e UPLOAD_TO_HF="${UPLOAD_TO_HF}" \
            bert-huggingface-wandb-demo
    