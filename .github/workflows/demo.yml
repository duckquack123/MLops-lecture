name: demo

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  bert-huggingface-wandb-demo:
    runs-on: ubuntu-latest

    env:
      WANDB_PROJECT: TA duty demo project
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bert-huggingface-wandb-demo .

      - name: Run inference inside Docker
        run: |
          docker run --rm \
            -e WANDB_API_KEY="${WANDB_API_KEY}" \
            -e WANDB_PROJECT="${WANDB_PROJECT}" \
            bert-huggingface-wandb-demo
    